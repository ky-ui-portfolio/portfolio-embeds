<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steal My Colors</title>
  <style>
    :root {
      --cranberry: #BB384E;
      --blush: #FCE9E5;
      --coral: #DE7A69;
      --ink: #24191A;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--blush);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .palette {
      width: min(100%, 760px);
      padding: 28px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.6rem);
      line-height: .9;
      letter-spacing: -.07em;
      text-transform: uppercase;
    }

    p {
      margin: 14px 0 26px;
      font-size: .95rem;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    button {
      min-height: 190px;
      padding: 18px;
      border: 0;
      border-radius: 18px;
      cursor: pointer;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .04em;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    button:hover,
    button:focus-visible {
      transform: translateY(-6px) rotate(-1deg);
      box-shadow: 0 12px 0 rgba(36, 25, 26, .18);
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    .cranberry { background: var(--cranberry); color: white; }
    .blush { background: var(--blush); color: var(--ink); border: 2px solid var(--ink); }
    .coral { background: var(--coral); color: var(--ink); }

    #message {
      min-height: 1.5em;
      margin-top: 20px;
      font-weight: 700;
    }

    @media (max-width: 520px) {
      .palette { padding: 20px; }
      .swatches { grid-template-columns: 1fr; }
      button { min-height: 105px; }
    }
  </style>
</head>
<body>
  <main class="palette">
    <h1>Steal my colors</h1>
    <p>Click a swatch to copy its hex code.</p>

    <div class="swatches">
      <button class="cranberry" data-color="#BB384E">#BB384E</button>
      <button class="blush" data-color="#FCE9E5">#FCE9E5</button>
      <button class="coral" data-color="#DE7A69">#DE7A69</button>
    </div>

    <p id="message" aria-live="polite"></p>
  </main>

  <script>
    const message = document.querySelector("#message");

    document.querySelectorAll("[data-color]").forEach((swatch) => {
      swatch.addEventListener("click", async () => {
        const color = swatch.dataset.color;

        try {
          await navigator.clipboard.writeText(color);
          message.textContent = `${color} copied — use it wisely.`;
        } catch {
          message.textContent = `${color} — copy this one manually.`;
        }
      });
    });
  </script>
</body>
</html>
